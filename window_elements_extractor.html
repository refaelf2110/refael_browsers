function promiseTimeout(ms, promise) {
	return new Promise(function(resolve, reject) {
		// create a timeout to reject promise if not resolved
		var timer = setTimeout(function(){
			reject("1")
		}, ms);

	promise
		.then(function(res){
			clearTimeout(timer);
			resolve(res);
		})
		.catch(function(e){
			clearTimeout(timer);
			reject(String(e));
		});
	});
};

// Function to detect repeating patterns in object paths to prevent infinite loops
function hasRepeatingPattern(path, segmentCount) {
	segmentCount = segmentCount || 3; // Default: check last 3 segments
	var parts = path.split('.');
	
	// Need at least segmentCount * 2 parts to have a repeat
	if (parts.length < segmentCount * 2) {
		return false;
	}
	
	// Get the last N segments
	var lastSegments = parts.slice(-segmentCount).join('.');
	
	// Check if this pattern appears earlier in the path (before the last occurrence)
	var lastIndex = path.lastIndexOf(lastSegments);
	if (lastIndex === -1) {
		return false;
	}
	
	// Check if it appears before the last occurrence
	var beforeLast = path.substring(0, lastIndex);
	return beforeLast.indexOf(lastSegments) !== -1;
}

// Function to create element with error handling and logging
function createElementSafely(tagName, parent, attributes) {
	var attrInfo = attributes ? JSON.stringify(attributes) : 'none';
	var parentInfo = parent ? parent.tagName || 'document' : 'none';
	
	try {
		var elem = document.createElement(tagName);
		var attrErrors = [];
		
		if (attributes) {
			for (var attr in attributes) {
				try {
					elem[attr] = attributes[attr];
				} catch(e) {
					try {
						elem.setAttribute(attr, attributes[attr]);
					} catch(e2) {
						attrErrors.push(attr + ': ' + String(e2));
					}
				}
			}
		}
		
		var appendError = null;
		if (parent) {
			try {
				parent.appendChild(elem);
			} catch(e) {
				appendError = String(e);
			}
		}
		
		// Log successful creation
		var successMsg = "/Name: createElement." + tagName + " /Type: ElementCreation /Status: SUCCESS /Parent: " + parentInfo + " /Attributes: " + attrInfo;
		if (attrErrors.length > 0) {
			successMsg += " /AttributeErrors: " + attrErrors.join('; ');
		}
		if (appendError) {
			successMsg += " /AppendError: " + appendError;
		}
		store_data(successMsg);
		
		return elem;
	} catch(e) {
		// Log failed creation
		var errorMsg = "/Name: createElement." + tagName + " /Type: ElementCreation /Status: FAILED /Parent: " + parentInfo + " /Attributes: " + attrInfo + " /Error: " + String(e);
		store_data(errorMsg);
		return null;
	}
}
